name: Privacy
description: >-
  Scan the files, the commits and the pull request text for secrets and
  personal data. Needs a checkout with fetch-depth 0.
inputs:
  denylist-secrets:
    description: >-
      The secrets context as JSON, from the expression toJSON(secrets). Every
      secret whose name starts with PRIVACY_DENYLIST holds denylisted terms;
      the others are ignored. Only the personal data scan receives it, not gitleaks.
    default: "{}"
  allowed-domains:
    description: Extra domains allowed in URLs, separated by spaces or commas.
    default: ""
  exclude:
    description: Globs of files skipped by the generic patterns (never by the denylist or gitleaks).
    default: ""
  require-denylist:
    description: Fail when no denylist secret holds a term.
    default: "true"
runs:
  using: composite
  steps:
    # The personal data scan runs first: it masks the denylisted terms for
    # every later step of the job, including the gitleaks report.
    - name: Scan for personal data
      shell: bash
      env:
        CI_SECRETS: ${{ inputs.denylist-secrets }}
        ALLOWED_DOMAINS: ${{ inputs.allowed-domains }}
        EXCLUDE: ${{ inputs.exclude }}
        REQUIRE_DENYLIST: ${{ inputs.require-denylist }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: >-
        python3 -P -m ci_checks.privacy
        --allowed-domains "$ALLOWED_DOMAINS"
        --exclude "$EXCLUDE"
        --require-denylist "$REQUIRE_DENYLIST"
    - name: Install gitleaks
      if: ${{ !cancelled() }}
      uses: $/actions/setup-tools
      with:
        tools: gitleaks
    - name: Scan history for secrets
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CONFIG: ${{ github.action_path }}/gitleaks.toml
        # The history of the pull request head, or of the pushed commit.
        TIP: ${{ github.event.pull_request.head.sha || 'HEAD' }}
      run: |
        # gitleaks also reads .gitleaksignore from the scanned tree and the
        # working directory, so it runs from an empty directory on the git
        # directory itself: the files of a pull request cannot hide a finding.
        git_dir="$(git rev-parse --absolute-git-dir)"
        work="$(mktemp -d)"
        report="${work}.json"
        cd "$work"
        gitleaks git --no-banner --redact --exit-code 0 --config "$CONFIG" \
          --gitleaks-ignore-path "$work" --log-opts="$TIP" \
          --report-format json --report-path "$report" "$git_dir"
        # Report where each secret is, without the author fields that
        # --verbose would print.
        jq -r 'def prop: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")
            | gsub(":"; "%3A") | gsub(","; "%2C");
          .[] | "::error file=\(.File | prop),line=\(.StartLine)::Possible secret"
            + " (\(.RuleID)) added by commit \(.Commit[0:12]). Revoke it, then remove it"
            + " from the history."' "$report"
        count="$(jq length "$report")"
        if [[ "$count" -gt 0 ]]; then
          echo "Secrets: ${count} finding(s)."
          exit 1
        fi
        echo "Secrets: no problem found."
