name: Privacy
description: >-
  Scan the files, the commits and the pull request text for secrets and
  personal data. Needs a checkout with fetch-depth 0. The denylist is read
  from the PRIVACY_DENYLIST environment variable, which the calling step sets
  from a secret.
inputs:
  allowed-domains:
    description: Extra domains allowed in URLs, separated by spaces or commas.
    default: ""
  exclude:
    description: Globs of files skipped by the generic patterns (never by the denylist or gitleaks).
    default: ""
  require-denylist:
    description: >-
      Fail when the denylist is empty. Pull requests from forks never receive
      secrets, so with this set they always fail.
    default: "true"
  secrets-ignore:
    description: >-
      Fingerprints of known gitleaks false positives already in the history
      of the base branch, one per line, as commit:path:rule:line (with an
      empty path for a commit message). Each ignored finding is reported as a
      warning.
    default: ""
runs:
  using: composite
  steps:
    # The personal data scan runs first: it masks the denylisted terms for
    # every later step of the job, including the gitleaks report.
    - name: Scan for personal data
      shell: bash
      env:
        ALLOWED_DOMAINS: ${{ inputs.allowed-domains }}
        EXCLUDE: ${{ inputs.exclude }}
        REQUIRE_DENYLIST: ${{ inputs.require-denylist }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: >-
        python3 -P -m ci_checks.privacy
        --allowed-domains "$ALLOWED_DOMAINS"
        --exclude "$EXCLUDE"
        --require-denylist "$REQUIRE_DENYLIST"
    - name: Install gitleaks
      if: ${{ !cancelled() }}
      uses: $/actions/setup-tools
      with:
        tools: gitleaks
    # gitleaks reads every commit of the history, then the commit messages,
    # the pull request text and the files it cannot read in a diff.
    - name: Scan for secrets
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CONFIG: ${{ github.action_path }}/gitleaks.toml
        SECRETS_IGNORE: ${{ inputs.secrets-ignore }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: >-
        python3 -P -m ci_checks.secrets
        --config "$CONFIG"
        --ignore "$SECRETS_IGNORE"
