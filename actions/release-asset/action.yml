name: Release asset
description: >-
  Build the asset of a release: optionally install the npm development tools
  and run a build command, then zip the contents of a folder into the runner's
  temporary folder, for the release step of the same job. Nothing is uploaded
  as a workflow artifact, so the artifact storage quota does not apply.
inputs:
  build-command:
    description: >-
      Command that builds the folder, run after `npm ci --ignore-scripts` with
      Node 24. Empty to zip the folder as it is in the repository.
    default: ""
  asset-path:
    description: Folder whose contents are zipped, relative to the repository.
    required: true
  asset-name:
    description: File name of the zip, such as the `filename` of hacs.json.
    required: true
outputs:
  path:
    description: Path of the zip.
    value: ${{ steps.zip.outputs.path }}
runs:
  using: composite
  steps:
    # Before the build, so that a wrong name fails in seconds.
    - name: Check the asset settings
      shell: bash
      env:
        ASSET_PATH: ${{ inputs.asset-path }}
        ASSET_NAME: ${{ inputs.asset-name }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: python3 -P -m ci_checks.release asset --path "$ASSET_PATH" --name "$ASSET_NAME"

    - name: Set up Node
      if: inputs.build-command != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # No package runs its install scripts.
    - name: Install the tools
      if: inputs.build-command != ''
      shell: bash
      run: npm ci --ignore-scripts

    - name: Build
      if: inputs.build-command != ''
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: eval "$BUILD_COMMAND"

    - name: Zip
      id: zip
      shell: bash
      env:
        ASSET_PATH: ${{ inputs.asset-path }}
        ASSET_NAME: ${{ inputs.asset-name }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: |
        python3 -P -m ci_checks.release asset --path "$ASSET_PATH" --name "$ASSET_NAME" \
          --output "$RUNNER_TEMP/release-asset"
        echo "path=$RUNNER_TEMP/release-asset/$ASSET_NAME" >> "$GITHUB_OUTPUT"
