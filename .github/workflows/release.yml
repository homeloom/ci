name: Publish release

# Publish a release for a commit of the default branch whose CI passed, when
# that commit changed the version to one greater than every release. Call it
# from a workflow triggered by workflow_run after CI completes.
#
# With asset-path and asset-name, the contents of a folder, built first by
# build-command when set, are zipped and attached to the release.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to release.
        type: string
        required: true
      version-file:
        description: File declaring the version. Defaults to the only integration manifest.
        type: string
        default: ""
      changelog:
        description: Changelog file.
        type: string
        default: CHANGELOG.md
      build-command:
        description: >-
          Command that builds the asset folder, run after `npm ci --ignore-scripts`
          with Node 24. Needs asset-path and asset-name.
        type: string
        default: ""
      asset-path:
        description: Folder whose contents are zipped and attached to the release.
        type: string
        default: ""
      asset-name:
        description: File name of the zip, such as the `filename` of hacs.json.
        type: string
        default: ""
      runs-on:
        description: >-
          Runner of every job, as JSON: a label in double quotes, a list of
          labels or a runner group object. Defaults to the CI_RUNS_ON
          variable, then to "ubuntu-24.04".
        type: string
        default: ""

permissions: {}

jobs:
  # One job: the zip goes from the build to the release on the runner's
  # disk, never through a workflow artifact, so that a full artifact storage
  # quota cannot block a release. Only the release steps get the token that
  # may write releases: the checkout keeps no credentials and the build steps
  # get no token.
  release:
    name: Release
    runs-on: ${{ fromJSON(inputs.runs-on || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      WITH_ASSET: ${{ inputs.asset-path != '' || inputs.asset-name != '' || inputs.build-command != '' }}
    steps:
      - name: Check the inputs
        if: env.WITH_ASSET == 'true'
        env:
          ASSET_PATH: ${{ inputs.asset-path }}
          ASSET_NAME: ${{ inputs.asset-name }}
        run: |
          if [[ -z "$ASSET_PATH" || -z "$ASSET_NAME" ]]; then
            echo "::error::Set asset-path and asset-name together. build-command needs both."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The parent tells whether this commit changed the version.
          fetch-depth: 2
          persist-credentials: false

      # With an asset, first check whether this commit is released, so that
      # the build only runs for a release.
      - name: Plan
        id: plan
        if: env.WITH_ASSET == 'true'
        uses: $/actions/release
        with:
          sha: ${{ inputs.sha }}
          version-file: ${{ inputs.version-file }}
          changelog: ${{ inputs.changelog }}
          plan: "true"

      - name: Build and zip
        id: asset
        if: steps.plan.outputs.release == 'true'
        uses: $/actions/release-asset
        with:
          build-command: ${{ inputs.build-command }}
          asset-path: ${{ inputs.asset-path }}
          asset-name: ${{ inputs.asset-name }}

      - name: Publish
        if: env.WITH_ASSET != 'true' || steps.plan.outputs.release == 'true'
        uses: $/actions/release
        with:
          sha: ${{ inputs.sha }}
          version-file: ${{ inputs.version-file }}
          changelog: ${{ inputs.changelog }}
          asset: ${{ steps.asset.outputs.path }}
