name: Publish release

# Publish a release for a commit of the default branch whose CI passed, when
# that commit changed the version to one greater than every release. Call it
# from a workflow triggered by workflow_run after CI completes.
#
# With asset-path and asset-name, the contents of a folder, built first by
# build-command when set, are zipped and attached to the release.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to release.
        type: string
        required: true
      version-file:
        description: File declaring the version. Defaults to the only integration manifest.
        type: string
        default: ""
      changelog:
        description: Changelog file.
        type: string
        default: CHANGELOG.md
      build-command:
        description: >-
          Command that builds the asset folder, run after `npm ci --ignore-scripts`
          with Node 24. Needs asset-path and asset-name.
        type: string
        default: ""
      asset-path:
        description: Folder whose contents are zipped and attached to the release.
        type: string
        default: ""
      asset-name:
        description: File name of the zip, such as the `filename` of hacs.json.
        type: string
        default: ""
      runs-on:
        description: >-
          Runner of every job, as JSON: a label in double quotes, a list of
          labels or a runner group object. Defaults to the CI_RUNS_ON
          variable, then to "ubuntu-24.04".
        type: string
        default: ""

permissions: {}

jobs:
  # With an asset, first check whether this commit is released, so that the
  # build only runs for a release. The build then runs in its own job,
  # without the token that may write releases.
  plan:
    name: Plan
    if: inputs.asset-path != '' || inputs.asset-name != '' || inputs.build-command != ''
    runs-on: ${{ fromJSON(inputs.runs-on || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Check the inputs
        env:
          ASSET_PATH: ${{ inputs.asset-path }}
          ASSET_NAME: ${{ inputs.asset-name }}
        run: |
          if [[ -z "$ASSET_PATH" || -z "$ASSET_NAME" ]]; then
            echo "::error::Set asset-path and asset-name together. build-command needs both."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Plan
        id: plan
        uses: $/actions/release
        with:
          sha: ${{ inputs.sha }}
          version-file: ${{ inputs.version-file }}
          changelog: ${{ inputs.changelog }}
          plan: "true"

  build:
    name: Build asset
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Build and zip
        uses: $/actions/release-asset
        with:
          build-command: ${{ inputs.build-command }}
          asset-path: ${{ inputs.asset-path }}
          asset-name: ${{ inputs.asset-name }}

  release:
    name: Release
    needs: [plan, build]
    # Without an asset, Plan and Build are skipped and this job decides alone.
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.build.result != 'failure' &&
      (inputs.asset-path == '' || needs.build.result == 'success')
    runs-on: ${{ fromJSON(inputs.runs-on || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The parent tells whether this commit changed the version.
          fetch-depth: 2
          persist-credentials: false

      - name: Download the asset
        if: inputs.asset-path != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-asset
          path: ${{ runner.temp }}/release-asset

      - name: Publish
        uses: $/actions/release
        with:
          sha: ${{ inputs.sha }}
          version-file: ${{ inputs.version-file }}
          changelog: ${{ inputs.changelog }}
          asset: ${{ inputs.asset-path != '' && format('{0}/release-asset/{1}', runner.temp, inputs.asset-name) || '' }}
