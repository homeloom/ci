name: Home Assistant tests

# Run pytest with pytest-homeassistant-custom-component against the oldest
# supported Home Assistant release (the "homeassistant" key of hacs.json) and
# the latest one, and fail when total coverage is under the threshold.
#
# The workflow chooses the versions of homeassistant and
# pytest-homeassistant-custom-component, so the test requirements file must
# not pin them.
#
# Coverage is measured with the workflow's own configuration: the coverage
# settings of the repository (.coveragerc, setup.cfg, tox.ini,
# pyproject.toml) are not read. Only the lines marked with
# "# pragma: no cover - <reason>", "if TYPE_CHECKING:" blocks and "..."
# stub bodies are excluded, and a pragma without a reason fails the job.

on:
  workflow_call:
    inputs:
      homeassistant-minimum:
        description: Oldest supported Home Assistant version. Defaults to the value in hacs.json.
        type: string
        default: ""
      python-minimum:
        description: Python version used with the oldest Home Assistant version. Defaults to the oldest one that release supports.
        type: string
        default: ""
      python-latest:
        description: Python version used with the latest Home Assistant version.
        type: string
        default: "3.14"
      requirements:
        description: Test requirements file, installed when it exists.
        type: string
        default: requirements_test.txt
      coverage-source:
        description: Package or directory measured for coverage, as pytest imports or finds it.
        type: string
        default: custom_components
      coverage-minimum:
        description: Minimum total coverage, in percent. Lowering it needs a written justification.
        type: number
        default: 95
      runs-on:
        description: >-
          Runner of every job, as JSON: a label in double quotes, a list of
          labels or a runner group object. Defaults to the CI_RUNS_ON
          variable, then to "ubuntu-24.04".
        type: string
        default: ""

permissions: {}

env:
  # Without a bound, a minimum version that no release supports makes uv
  # fall back to a release from 2021, which fails on current Python. 0.13
  # supports Home Assistant 2023.3 and later, so with this bound resolution
  # fails instead.
  PLUGIN: pytest-homeassistant-custom-component>=0.13

jobs:
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ fromJSON(inputs.runs-on || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [minimum, latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The minimum leg runs the oldest supported Home Assistant release with
      # the oldest Python it supports, unless python-minimum names one, and
      # the pytest-homeassistant-custom-component release that pins it.
      - name: Select versions
        id: select
        env:
          LEG: ${{ matrix.name }}
          MINIMUM: ${{ inputs.homeassistant-minimum }}
          PYTHON_MINIMUM: ${{ inputs.python-minimum }}
          PYTHON_LATEST: ${{ inputs.python-latest }}
        run: |
          : "${PLUGIN:?}"
          if [[ "$LEG" == "latest" ]]; then
            echo "spec=${PLUGIN}" >> "$GITHUB_OUTPUT"
            echo "python=${PYTHON_LATEST}" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$MINIMUM" ]]; then
              MINIMUM="$(jq -er '.homeassistant' hacs.json)" || {
                echo "::error::Set homeassistant-minimum or the homeassistant key of hacs.json."
                exit 1
              }
            fi
            python3 - "$MINIMUM" <<'PY'
          import json
          import operator
          import os
          import re
          import sys
          import time
          import urllib.request
          from datetime import datetime, timedelta

          minimum = sys.argv[1]
          pypi = os.environ.get("PYPI_URL", "https://pypi.org/pypi")
          plugin = re.match(r"[A-Za-z0-9._-]+", os.environ["PLUGIN"])[0]


          def fetch(path):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(f"{pypi}/{path}/json", timeout=60) as answer:
                          return json.load(answer)
                  except OSError as err:
                      if attempt == 2:
                          print(f"::error::Could not read {path} from PyPI: {err}")
                          sys.exit(1)
                      time.sleep(5)


          def uploaded(files):
              return min(datetime.fromisoformat(f["upload_time_iso_8601"]) for f in files)


          def version(text):
              return tuple(map(int, text.split(".")))


          def satisfies(python, requires):
              """Whether the newest patch of python (or python itself, with a patch) fits."""
              parts = version(python)
              compare = {">=": operator.ge, ">": operator.gt, "<=": operator.le, "<": operator.lt}
              for clause in requires.split(","):
                  match = re.fullmatch(r"\s*(>=|>|<=|<)\s*(\d+(?:\.\d+){0,2})\s*", clause)
                  if not match:
                      continue
                  wanted = version(match[2]) + (0,) * (2 - match[2].count("."))
                  newest = parts + (0 if match[1][0] == "<" else 999,) * (3 - len(parts))
                  if not compare[match[1]](newest, wanted):
                      return False
              return True


          release = fetch(f"homeassistant/{minimum}")
          requires = release["info"].get("requires_python") or ""
          chosen = os.environ.get("PYTHON_MINIMUM", "")
          if chosen and not satisfies(chosen, requires):
              print(
                  f"::error::Home Assistant {minimum} requires Python {requires}, and "
                  f"python-minimum is {chosen}. Set python-minimum to a version that "
                  "satisfies it, or leave it empty to use the oldest one that does."
              )
              sys.exit(1)
          if not chosen:
              latest = version(os.environ["PYTHON_LATEST"])
              candidates = [f"3.{minor}" for minor in range(12, latest[1] + 1)]
              chosen = next((python for python in candidates if satisfies(python, requires)), "")
              if not chosen:
                  print(
                      f"::error::Home Assistant {minimum} requires Python {requires}, which "
                      f"no version from 3.12 to python-latest satisfies. Set python-minimum."
                  )
                  sys.exit(1)

          # pytest-homeassistant-custom-component pins one Home Assistant
          # release in each of its releases, which follow it within days.
          released = uploaded(release["urls"])
          near = []
          found = None
          index = fetch(plugin)["releases"]
          window = sorted(
              (uploaded(files), number)
              for number, files in index.items()
              if files and timedelta(days=-30) <= uploaded(files) - released <= timedelta(days=60)
          )
          for when, number in window[:30]:
              requires_dist = fetch(f"{plugin}/{number}")["info"].get("requires_dist") or []
              pins = [re.fullmatch(r"homeassistant\s*==\s*([^\s;,]+)", item) for item in requires_dist]
              pinned = next((pin[1] for pin in pins if pin), None)
              if pinned == minimum:
                  found = (when, number)
                  break
              if pinned and re.fullmatch(r"\d+\.\d+\.\d+", pinned):
                  near.append(pinned)
          if found is None:
              hint = (
                  f" The releases near it pin {', '.join(sorted(set(near), key=version))}: set "
                  "homeassistant-minimum to one of them."
                  if near
                  else " Set homeassistant-minimum to a release that it supports."
              )
              print(f"::error::No {plugin} release pins Home Assistant {minimum}.{hint}")
              sys.exit(1)

          # Old releases do not pin their transitive dependencies, and newer
          # ones break them. Resolve as of one week after the release, which
          # matches what an install of that release had, and late enough for
          # the plugin release.
          cutoff = max(released + timedelta(days=7), found[0] + timedelta(days=1))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"spec=homeassistant=={minimum}\n")
              output.write(f"plugin={plugin}=={found[1]}\n")
              output.write(f"python={chosen}\n")
              output.write(f"cutoff={cutoff.strftime('%Y-%m-%dT%H:%M:%SZ')}\n")
          PY
          fi
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.select.outputs.python }}

      - name: Install uv
        uses: $/actions/setup-tools
        with:
          tools: uv

      # The uv cache sits in RUNNER_TEMP, on the same file system as the
      # virtual environment, so that uv links the files it installs rather
      # than copying them.
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-${{ matrix.name }}-${{ steps.select.outputs.python }}-${{ steps.select.outputs.week }}-${{ hashFiles(inputs.requirements, 'custom_components/*/manifest.json', 'hacs.json') }}
          restore-keys: |
            uv-${{ matrix.name }}-${{ steps.select.outputs.python }}-

      # A self-hosted runner keeps the Python of the tool cache from one job
      # to the next, so nothing is installed into it: the test plugins would
      # load in the tests of other jobs. The virtual environment and the uv
      # cache go away with RUNNER_TEMP at the end of the job.
      #
      # The environment is not added to PATH: Home Assistant installs an older
      # uv into it, which would then run instead of the pinned one. Only the
      # test step activates it.
      - name: Create a virtual environment
        run: |
          venv="${RUNNER_TEMP}/ha-tests-venv"
          export UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache"
          uv venv --quiet --python "$(command -v python)" "$venv"
          echo "VIRTUAL_ENV=${venv}" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=${UV_CACHE_DIR}" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          SPEC: ${{ steps.select.outputs.spec }}
          PLUGIN_SPEC: ${{ steps.select.outputs.plugin }}
          CUTOFF: ${{ steps.select.outputs.cutoff }}
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          runtime="${RUNNER_TEMP}/runtime.txt"
          shopt -s nullglob
          manifests=(custom_components/*/manifest.json)
          if (( ${#manifests[@]} )); then
            jq -r '.requirements[]?' "${manifests[@]}" > "$runtime"
          else
            : > "$runtime"
          fi
          args=("$SPEC" "${PLUGIN_SPEC:-$PLUGIN}" --requirement "$runtime")
          if [[ -f "$REQUIREMENTS" ]]; then
            args+=(--requirement "$REQUIREMENTS")
          fi
          if [[ -n "$CUTOFF" ]]; then
            # The integration's own requirements are installed at their
            # current versions, as Home Assistant does at runtime.
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            args+=(--exclude-newer "$CUTOFF")
            while read -r name; do
              args+=(--exclude-newer-package "${name}=${now}")
            done < <(sed -nE 's/^[[:space:]]*([A-Za-z0-9][A-Za-z0-9._-]*).*/\1/p' "$runtime")
          fi
          uv pip install --python "${VIRTUAL_ENV}/bin/python" "${args[@]}"
          uv pip show --python "${VIRTUAL_ENV}/bin/python" homeassistant pytest-homeassistant-custom-component | grep -E '^(Name|Version):'

      - name: Run tests
        env:
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          COVERAGE_MINIMUM: ${{ inputs.coverage-minimum }}
        run: |
          # Passing this file to pytest-cov and coverage means that no coverage
          # setting of the repository is read. A bare --cov makes pytest-cov
          # measure the source of this file only, whatever --cov options the
          # pytest configuration adds, and the report fails without data, for
          # example when that configuration adds --no-cov.
          #
          # A pragma only excludes code when it gives a reason, with spaces or
          # tabs as whitespace, so the next step reports every pragma that
          # excludes nothing. The pragma pattern stays first: on a line of its
          # own, a pattern starting with "#" would be read as a comment.
          config="${RUNNER_TEMP}/coverage/coveragerc"
          mkdir -p "${RUNNER_TEMP}/coverage"
          cat > "$config" <<EOF
          [run]
          data_file = ${RUNNER_TEMP}/coverage/data
          source = ${COVERAGE_SOURCE}
          [report]
          exclude_lines = #[ \t]*(pragma|PRAGMA)[: \t]?[ \t]*(no|NO)[ \t]*(cover|COVER)[ \t]*[-:][ \t]*[A-Za-z0-9]
              ^[ \t]*if[ \t]+(typing\.)?TYPE_CHECKING[ \t]*:
              ^[ \t]*\.\.\.[ \t]*(#.*)?$
          precision = 2
          show_missing = true
          skip_covered = true
          EOF
          export PATH="${VIRTUAL_ENV}/bin:${PATH}"
          python -m pytest --cov --cov-config="$config" --cov-report=
          python -m coverage report --rcfile="$config" --fail-under="$COVERAGE_MINIMUM"

      # A pragma without a reason excludes nothing but reads as if it did. The
      # coverage source can be a package anywhere, so every Python file of the
      # repository is checked.
      - name: Check coverage pragmas
        if: ${{ !cancelled() }}
        run: |
          pragma='#[[:space:]]*(pragma|PRAGMA)[:[:space:]]?[[:space:]]*(no|NO)[[:space:]]*(cover|COVER)'
          reason="${pragma}[[:space:]]*[-:][[:space:]]*[[:alnum:]]"
          status=0
          while IFS= read -r -d '' path && IFS=: read -r number line; do
            if [[ ! "$line" =~ $reason ]]; then
              echo "::error::${path}:${number}: give the reason after the pragma, as in \"# pragma: no cover - <reason>\"."
              status=1
            fi
          done < <(git ls-files -z -- '*.py' | xargs -0 --no-run-if-empty grep -nHZE "$pragma" --)
          exit "$status"

      - name: Prune uv cache
        if: always()
        run: |
          uv cache prune --ci
