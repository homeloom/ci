name: CI

# CI of a Home Assistant integration, built from the shared workflows of
# homeloom/ci. Draft pull requests skip every job, Report included, to save
# runner minutes; marking the pull request ready for review starts a full run.
# Branch protection requires the Report job.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/hygiene.yml@REPLACE_WITH_RELEASE_SHA # vX.Y.Z
    with:
      # Session links that AI coding assistants add to commits and pull requests.
      allowed-domains: claude.ai claude.com
    secrets:
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

  lint:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/python-lint.yml@REPLACE_WITH_RELEASE_SHA # vX.Y.Z

  tests:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/ha-tests.yml@REPLACE_WITH_RELEASE_SHA # vX.Y.Z

  validate:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/ha-integration.yml@REPLACE_WITH_RELEASE_SHA # vX.Y.Z

  report:
    name: Report
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    needs: [hygiene, lint, tests, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
